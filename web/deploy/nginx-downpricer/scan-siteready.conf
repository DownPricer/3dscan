# SiteReady Scan — Visitevirtuel
# Copier sur le VPS :
#   /opt/downpricer/nginx/conf.d/scan-siteready.conf
#
# Prérequis :
#   docker network connect 3dscan_default downpricer-nginx
#
# Rechargement :
#   docker exec downpricer-nginx nginx -t
#   docker exec downpricer-nginx nginx -s reload
#
# Test :
#   curl -sS -H 'Host: scan.sitereadyshd.fr' http://127.0.0.1/ -o /dev/null -w '%{http_code}\n'

upstream scan_front {
    server 3dscan-front:3000;
    keepalive 8;
}

# --- HTTP (actif avant certificat) ---
server {
    listen 80;
    server_name scan.sitereadyshd.fr scan.siteready.fr;

    client_max_body_size 500M;

    location / {
        proxy_pass http://scan_front;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}

